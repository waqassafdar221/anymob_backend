name: anymob-backend
x-backend: &backend
  build: .
  env_file: .env
  environment: &environment
    DATABASE_URL: postgresql+asyncpg://anymob:anymob@postgres:5432/anymob
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://minio:9000
    S3_PUBLIC_ENDPOINT: http://localhost:9000
    SMTP_HOST: mailpit
    SMTP_PORT: 1025
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    storage-init:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: anymob
      POSTGRES_PASSWORD: anymob
      POSTGRES_DB: anymob
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anymob -d anymob"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 15
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-anymob}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-anymob-local-storage}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: ["media-data:/data"]
  storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on: [minio]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-anymob}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-anymob-local-storage}
      S3_BUCKET: ${S3_BUCKET:-anymob}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"; do sleep 2; done
        mc mb --ignore-existing "local/$$S3_BUCKET"
        mc anonymous set none "local/$$S3_BUCKET"
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      retries: 10
  worker:
    <<: *backend
    command: ["celery", "-A", "anymob.worker:celery", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
  beat:
    <<: *backend
    command: ["celery", "-A", "anymob.worker:celery", "beat", "--loglevel=info", "--schedule=/tmp/anymob-beat"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
volumes:
  postgres-data:
  redis-data:
  media-data:
