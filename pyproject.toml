[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "anymob-backend"
version = "0.1.0"
description = "AnyMob marketplace API and workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.128.0", "uvicorn[standard]==0.40.0",
  "SQLAlchemy[asyncio]==2.0.45", "asyncpg==0.31.0", "alembic==1.18.1",
  "pydantic-settings==2.12.0", "email-validator==2.3.0",
  "PyJWT==2.10.1", "argon2-cffi==25.1.0", "cryptography==46.0.3",
  "redis==7.1.0", "celery==5.6.2", "boto3==1.42.30",
  "Pillow==12.1.0", "python-multipart==0.0.21", "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "ruff==0.14.13"]

[project.scripts]
anymob = "anymob.cli:main"

[tool.vercel]
entrypoint = "anymob.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["anymob*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
